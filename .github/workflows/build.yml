name: Build Client

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.gitignore'
      - '.prettierignore'
      - '.prettierrc.yaml'
      - '.env.example'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install X11 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev libxkbcommon-dev libxkbfile-dev \
            libxrandr-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libpipewire-0.3-dev

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/audio-capture
            pylon-e2ee

      # build:e2ee needs the wasm-bindgen CLI at the version pylon-e2ee's Cargo.lock pins.
      - name: Read wasm-bindgen version
        id: wasm-bindgen
        shell: bash
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' pylon-e2ee/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build E2EE WASM
        run: npm run build:e2ee

      - name: Build native audio addon
        run: npm run build:native

      - name: Verify native audio addon built
        shell: bash
        run: node -e "require('./native/audio-capture/index.js'); console.log('audio-capture addon loaded')"

      - name: Build + Package
        run: npm run ${{ matrix.script }} -- --publish=never
