name: Build Client

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.gitignore'
      - '.prettierignore'
      - '.prettierrc.yaml'
      - '.env.example'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            # 45: the media engine's FFmpeg and sidecar when their caches miss.
            timeout: 45
          # 60: the media engine's FFmpeg (about 20 minutes when its cache misses) and sidecar.
          - os: windows-latest
            script: build:win
            timeout: 60
          - os: macos-latest
            script: build:mac
            timeout: 30

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install X11 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev libxkbcommon-dev libxkbfile-dev \
            libxrandr-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libpipewire-0.3-dev

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/audio-capture
            pylon-e2ee
            native/media-engine

      # build:e2ee needs the wasm-bindgen CLI at the version pylon-e2ee's Cargo.lock pins.
      - name: Read wasm-bindgen version
        id: wasm-bindgen
        shell: bash
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' pylon-e2ee/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build E2EE WASM
        run: npm run build:e2ee

      - name: Build native audio addon
        run: npm run build:native

      - name: Verify native audio addon built
        shell: bash
        run: node -e "require('./native/audio-capture/index.js'); console.log('audio-capture addon loaded')"

      # The media engine's sidecar for the Windows installer: our lean LGPL FFmpeg from
      # native/media-engine/windows/ffmpeg-build.sh, cached on the
      # recipe and its patch (a hit skips MSYS2 and the build), then the sidecar built against it
      # and staged with its DLLs and licence texts into native/media-engine/dist, which
      # electron-builder.yml ships as resources/media-engine.
      - name: Restore the media engine's FFmpeg (Windows)
        id: ffmpeg-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: native/media-engine/ffmpeg-win
          key: ffmpeg-win-${{ hashFiles('native/media-engine/windows/ffmpeg-build.sh', 'native/media-engine/nvenc-reconfig-no-idr.patch') }}

      - name: Setup MSYS2 for FFmpeg (Windows, FFmpeg not cached)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # The packages of native/media-engine/windows/ffmpeg.md.
          install: >-
            make diffutils patch tar xz curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-ffnvcodec-headers

      - name: Build the media engine's FFmpeg (Windows, FFmpeg not cached)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          bash native/media-engine/windows/ffmpeg-build.sh \
            "$(cygpath -u "$RUNNER_TEMP")/ffbuild" \
            "$(cygpath -u "$GITHUB_WORKSPACE")/native/media-engine/ffmpeg-win"

      # Saved at once, so a later failure in the job does not lose the build.
      - name: Save the media engine's FFmpeg (Windows, FFmpeg not cached)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: native/media-engine/ffmpeg-win
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Build and stage the media engine's sidecar (Windows)
        if: runner.os == 'Windows'
        env:
          FFMPEG_DIR: ${{ github.workspace }}\native\media-engine\ffmpeg-win
          # LLVM's libclang for the FFmpeg bindings, from the runner's own LLVM.
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: npm run build:media-engine:win

      # The media engine's sidecar for the AppImage and deb, the Linux twin of the Windows steps
      # above: our lean LGPL FFmpeg from native/media-engine/linux/ffmpeg-build.sh, cached on the
      # recipe, its patch and the runner's distribution (the libraries link the runner's libva,
      # libdrm and glibc), then the sidecar built against it and staged with its libraries ($ORIGIN
      # run path) and licence texts into native/media-engine/dist. libva, libdrm, PipeWire and
      # libEGL are the user's system's. The package lists are refreshed by the X11 step above.
      - name: Install the media engine's build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            nasm pkg-config patchelf libva-dev libdrm-dev libegl-dev libclang-dev

      - name: Read the runner's distribution (Linux)
        id: os-release
        if: runner.os == 'Linux'
        run: echo "id=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")" >> "$GITHUB_OUTPUT"

      - name: Restore the media engine's FFmpeg (Linux)
        id: ffmpeg-cache-linux
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v5
        with:
          path: native/media-engine/ffmpeg-linux
          key: ffmpeg-linux-${{ steps.os-release.outputs.id }}-${{ hashFiles('native/media-engine/linux/ffmpeg-build.sh', 'native/media-engine/ffmpeg-vaapi-rate-change.patch') }}

      - name: Build the media engine's FFmpeg (Linux, FFmpeg not cached)
        if: runner.os == 'Linux' && steps.ffmpeg-cache-linux.outputs.cache-hit != 'true'
        run: |
          bash native/media-engine/linux/ffmpeg-build.sh \
            "$RUNNER_TEMP/ffbuild" "$GITHUB_WORKSPACE/native/media-engine/ffmpeg-linux"

      # Saved at once, so a later failure in the job does not lose the build.
      - name: Save the media engine's FFmpeg (Linux, FFmpeg not cached)
        if: runner.os == 'Linux' && steps.ffmpeg-cache-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: native/media-engine/ffmpeg-linux
          key: ${{ steps.ffmpeg-cache-linux.outputs.cache-primary-key }}

      - name: Build and stage the media engine's sidecar (Linux)
        if: runner.os == 'Linux'
        env:
          FFMPEG_DIR: ${{ github.workspace }}/native/media-engine/ffmpeg-linux
        run: npm run build:media-engine:linux

      - name: Build + Package
        run: npm run ${{ matrix.script }} -- --publish=never

      # The unpacked app holds its sidecar, and the sidecar answers hello from there with no
      # FFmpeg on PATH (its DLLs are found beside it).
      - name: Check the packaged sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = 'dist\win-unpacked\resources\media-engine'
          $exe = "$dir\pylon-media-host.exe"
          if (-not (Test-Path $exe)) { throw "no $exe" }
          Get-ChildItem $dir -Recurse -File | ForEach-Object { "$($_.FullName.Substring((Resolve-Path $dir).Path.Length + 1))  $($_.Length)" }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and -not (Test-Path -Path (Join-Path $_ 'avcodec-*.dll') -ErrorAction SilentlyContinue) }) -join ';'
          $answer = cmd /c "echo {""hello"":{""protocol"":1}}| ""$((Resolve-Path $exe).Path)"" 2>nul"
          $hello = @($answer) | Where-Object { $_ -like '{"hello"*' } | Select-Object -First 1
          if (-not $hello) { throw "the packaged sidecar did not answer hello (exit $LASTEXITCODE): $answer" }
          "hello: $hello"

      # The unpacked app, the AppImage and the deb each hold the sidecar, its libraries are taken
      # from its own folder ($ORIGIN) and nothing is missing, and it answers hello. The snap's
      # listing is printed for the record.
      - name: Check the packaged sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          check() {
            local dir exe links answer
            dir=$(realpath "$1"); exe=$dir/pylon-media-host
            echo "== $2: $dir"
            test -x "$exe" || { echo "::error::no sidecar in the $2 ($exe)"; exit 1; }
            find "$dir" -type f -printf '  %P  %s\n' | sort
            links=$(env -u LD_LIBRARY_PATH ldd "$exe")
            echo "$links"
            if grep -q 'not found' <<<"$links"; then echo "::error::the $2's sidecar is missing a library"; exit 1; fi
            for lib in libavcodec libavfilter libavutil; do
              grep -q -E "^\s*$lib\.so\.[0-9]+ => $dir/" <<<"$links" || { echo "::error::the $2's $lib is not its own"; exit 1; }
            done
            answer=$(printf '{"hello":{"protocol":1}}\n' | env -u LD_LIBRARY_PATH "$exe" 2>/dev/null | grep -m1 '^{"hello"' || true)
            test -n "$answer" || { echo "::error::the $2's sidecar did not answer hello"; exit 1; }
            echo "hello: $answer"
          }
          check dist/linux-unpacked/resources/media-engine 'unpacked app'
          appimage=$(realpath dist/*.AppImage)
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          check "$RUNNER_TEMP/squashfs-root/resources/media-engine" AppImage
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/deb"
          check "$RUNNER_TEMP/deb/opt/Pylon/resources/media-engine" deb
          echo "== snap"
          if ! command -v unsquashfs >/dev/null; then
            echo "unsquashfs is not on the runner: the snap is not listed"
          elif unsquashfs -l dist/*.snap | grep '/resources/media-engine'; then
            echo "the snap holds the sidecar"
          else
            echo "the snap holds no sidecar"
          fi

  build-status:
    name: Build status
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = "success"
