<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wb" id="app" hidden>
      <div class="stage" id="stage">
        <div class="board" id="board">
          <canvas class="layer paper" id="paper" width="1920" height="1080"></canvas>
          <canvas class="layer" id="view" width="1920" height="1080"></canvas>
          <div class="layer live" id="live-wrap">
            <canvas class="layer" id="live" width="1920" height="1080"></canvas>
            <canvas class="layer" id="tail" width="1920" height="1080"></canvas>
          </div>
          <canvas class="layer" id="fx" width="1920" height="1080"></canvas>
          <div class="layer guides" id="guides"></div>
          <div class="layer sweep" id="sweep" hidden></div>
        </div>
        <div class="cursors" id="cursors"></div>
        <div class="text-edit" id="text-edit" hidden>
          <textarea id="text-input" rows="1" maxlength="280" spellcheck="false"></textarea>
        </div>
        <div class="ring" id="ring" hidden></div>
      </div>
      <div class="bar top-left" id="bar-left"></div>
      <div class="bar top-right" id="bar-right"></div>
      <div class="banner" id="banner" hidden></div>
      <div class="note" id="note" role="status" hidden></div>
      <div class="loading" id="loading">
        <span id="loading-text">Joining the board</span>
        <span class="loading-track"><span class="loading-fill" id="loading-fill"></span></span>
      </div>
      <nav class="dock" id="dock" aria-label="Tools"></nav>
      <div class="lapse" id="lapse" hidden></div>
      <div class="pops" id="pops"></div>
      <div class="toasts" id="toasts" role="status"></div>
      <div class="tip" id="tip" hidden></div>
    </main>
    <script src="../shared/bridge.js"></script>
    <script src="../shared/room.js"></script>
    <script src="net.js"></script>
    <script src="icons.js"></script>
    <script src="stamps.js"></script>
    <script src="engine.js"></script>
    <script src="board.js"></script>
    <script src="widgets.js"></script>
    <script src="main.js"></script>
  </body>
</html>
